name: Build and Test openDAQ

on:
  workflow_dispatch:
    inputs:
      ctest_preset:
        type: string
        default: "run_tests_parallel"
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_call:
    inputs:
      ctest_preset:
        type: string
        default: "run_tests_parallel"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    if: ${{ ! github.event.pull_request.draft }}
    name: openDAQ
    uses: openDAQ/openDAQ-CI/.github/workflows/reusable.yml@v3
    with:
      timeout: '[{"timeout-minutes": 270}]'
      include-jobs: >
        [
          "windows-2022-x86_64-msvs-v143-debug",
          "windows-2022-x86-msvs-v143-release",
          "windows-2022-x86_64-ninja-clang-release",
          "windows-2022-x86_64-ninja-intel-cc-release",
          "ubuntu-20.04-x86-ninja-gcc-7-release",
          "ubuntu-20.04-armv8-ninja-clang-9-release",
          "ubuntu-24.04-armv8-ninja-gcc-14-debug",
          "ubuntu-24.04-x86_64-ninja-clang-18-release",
          "manylinux_2_28-x86_64-ninja-gcc-14-release",
          "manylinux_2_28-armv8-ninja-gcc-14-release",
          "macos-26-x86_64-ninja-appleclang-17-debug",
          "macos-26-armv8-ninja-appleclang-21-release"
        ]
      packages: >
        [
          {
            "match-jobs": ["ubuntu-*-x86_64-*", "ubuntu-*-armv8-*"],
            "apt-install": ["lld", "libssl-dev", "libx11-dev", "libxi-dev", "libxcursor-dev", "libxrandr-dev", "libgl-dev", "libudev-dev", "libfreetype6-dev"]
          },
          {
            "match-jobs": ["ubuntu-*-x86-*"],
            "apt-install": ["lld", "libssl-dev:i386", "libx11-dev:i386", "libxi-dev:i386", "libxcursor-dev:i386", "libxrandr-dev:i386", "libgl-dev:i386", "libudev-dev:i386", "libfreetype6-dev:i386"]
          },
          {
            "match-jobs": ["windows-*"],
            "vcpkg-install": ["openssl"]
          },
          {
            "match-jobs": ["windows-*", "ubuntu-*-x86_64-*", "ubuntu-*-armv8-*", "macos-*"],
            "pip-install": ["numpy"],
            "use-python-version": "3.14"
          },
          {
            "match-jobs": ["manylinux*"],
            "yum-install": ["openssl-devel", "libX11-devel", "libXrandr-devel", "libXcursor-devel", "libXi-devel", "mesa-libGL-devel", "systemd-devel", "freetype-devel", "mono-core"],
            "run": "/opt/python/cp314-cp314/bin/python -m pip install numpy"
          },
          {
            "match-jobs": ["ubuntu-20.04-*-clang-9-*"],
            "use-python-version": "3.8"
          }
        ]
      cmake-presets: >
        [
          {
            "configure-preset": "${{ inputs.cmake_preset || 'ci' }}",
            "test-preset": "${{ inputs.ctest_preset || 'run_tests_parallel' }}",
            "cache-variables": {"OPENDAQ_PYTHON_VERSION": "3.14"},
            "cache-externals": true
          },
          {
            "match-jobs": ["windows-*-x86-*"],
            "cache-variables": {"OPENSSL_ROOT_DIR": "C:/vcpkg/installed/x86-windows"}
          },
          {
            "match-jobs": ["windows-*-x86_64-*"],
            "cache-variables": {"OPENSSL_ROOT_DIR": "C:/vcpkg/installed/x64-windows"}
          },
          {
            "match-jobs": ["manylinux*"],
            "cache-variables": {"Python_EXECUTABLE": "/opt/python/cp314-cp314/bin/python"}
          },
          {
            "match-jobs": ["macos-*"],
            "test-preset": "${{ inputs.ctest_preset != 'run_tests_parallel' && inputs.ctest_preset || 'run_tests_parallel_macos' }}",
            "run-tests-priv": true
          },
          {
            "match-jobs": ["macos-*-x86_64-*"],
            "cache-variables": {"CMAKE_OSX_DEPLOYMENT_TARGET": "10.15"}
          },
          {
            "match-jobs": ["macos-*-armv8-*"],
            "cache-variables": {"CMAKE_OSX_DEPLOYMENT_TARGET": "11.0"}
          },
          {
            "match-jobs": ["ubuntu-20.04-*-gcc-7-*", "ubuntu-20.04-*-clang-9-*"],
            "cache-variables": {
              "DAQMODULES_REF_FB_MODULE_ENABLE_RENDERER": false,
              "DAQMODULES_BASIC_CSV_RECORDER_MODULE": false,
              "OPENDAQ_PYTHON_VERSION": "3.8"
            }
          },
          {
            "match-jobs": ["ubuntu-20.04-x86-*"],
            "cache-variables": {
              "OPENDAQ_FORCE_COMPILE_32BIT": true,
              "OPENDAQ_GENERATE_PYTHON_BINDINGS": false,
              "OPENDAQ_GENERATE_CSHARP_BINDINGS": false,
              "CMAKE_CXX_FLAGS": "-Wno-error=shift-count-overflow"
            }
          },
          {
            "match-jobs": ["*-intel-cc-*"],
            "cache-variables": {
              "OPENDAQ_GENERATE_PYTHON_BINDINGS": false,
              "OPENDAQ_GENERATE_CSHARP_BINDINGS": false
            }
          }
        ]
