name: Build openDAQ stagings

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      ref:
        description: "The commit to stage, in full (empty: the head of the branch dispatched on)"
        default: ""
      skip-staging-push:
        description: "Build only, keep the staging as an artifact of the run"
        type: boolean
        default: false
  # from another repository's run (the bundle): staged as an artifact of that run, never pushed
  workflow_call:
    inputs:
      ref:
        description: "The commit to stage, in full (empty: the commit this workflow is called at)"
        type: string
        default: ""

jobs:
  resolve:
    name: Resolve the commit
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.commit.outputs.ref }}
      repository: ${{ job.workflow_repository }}
      channel: ${{ steps.channel.outputs.channel }}
      skip-staging-push: ${{ inputs.skip-staging-push || job.workflow_ref != github.workflow_ref }}
    steps:
      # this repository, also when called from another one
      - uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ inputs.ref || job.workflow_sha }}

      - name: Resolve the commit
        id: commit
        run: echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # where it lies picks its channel
      - uses: openDAQ/openDAQ-CI/.github/actions/resolve-channel@bundle/extract-each-artifact-into-its-dir
        id: channel
        with:
          repository: ${{ job.workflow_repository }}
          commit: ${{ steps.commit.outputs.ref }}

  stage:
    needs: resolve
    name: openDAQ
    permissions:
      contents: read
      packages: write
    uses: openDAQ/openDAQ-CI/.github/workflows/stage.yml@bundle/extract-each-artifact-into-its-dir
    with:
      repository: ${{ needs.resolve.outputs.repository }}
      ref: ${{ needs.resolve.outputs.ref }}
      upload-pattern: opendaq-*
      timeout: '[{"timeout-minutes": 180}]'
      include-jobs: >
        [
          "windows-2022-x86_64-msvs-v143-release",
          "windows-2022-x86-msvs-v143-release",
          "manylinux_2_28-x86_64-ninja-gcc-14-release",
          "manylinux_2_28-armv8-ninja-gcc-14-release",
          "ubuntu-22.04-x86_64-ninja-gcc-release",
          "ubuntu-22.04-armv8-ninja-gcc-release",
          "macos-26-x86_64-ninja-appleclang-21-release",
          "macos-26-armv8-ninja-appleclang-21-release"
        ]
      cmake-presets: >
        [
          {
            "match-jobs": ["*"],
            "configure-preset": "stage"
          },
          {
            "match-jobs": ["windows-*-msvs-*"],
            "cache-variables": {"OPENDAQ_MSVC_SINGLE_PROCESS_BUILD": true}
          },
          {
            "match-jobs": ["macos-*-x86_64-*"],
            "cache-variables": {"CMAKE_OSX_DEPLOYMENT_TARGET": "10.15"}
          },
          {
            "match-jobs": ["macos-*-armv8-*"],
            "cache-variables": {"CMAKE_OSX_DEPLOYMENT_TARGET": "11.0"}
          }
        ]
      packages: >
        [
          {
            "match-jobs": ["manylinux_2_28-*"],
            "yum-install": ["libX11-devel", "libXrandr-devel", "libXcursor-devel", "libXi-devel", "mesa-libGL-devel", "systemd-devel", "freetype-devel", "mono-core"]
          },
          {
            "match-jobs": ["ubuntu-*"],
            "apt-install": ["libx11-dev", "libxi-dev", "libxcursor-dev", "libxrandr-dev", "libgl-dev", "libudev-dev", "libfreetype6-dev"]
          },
          {
            "match-jobs": ["windows-*"],
            "choco-install": ["nsis"]
          }
        ]
      cpack-presets: >
        [
          {
            "match-jobs": ["*"],
            "stagings": [{"name": "core"}]
          },
          {
            "match-jobs": ["windows-*"],
            "installers": [{"name": "core", "package": "NSIS"}]
          },
          {
            "match-jobs": ["ubuntu-*"],
            "installers": [{"name": "core", "package": "DEB"}]
          },
          {
            "match-jobs": ["macos-*"],
            "installers": [{"name": "core", "package": "productbuild"}]
          }
        ]
      skip-staging-push: ${{ needs.resolve.outputs.skip-staging-push == 'true' }}
      staging-push: >-
        [
          {
            "path": "ghcr.io/${{ github.repository_owner }}/${{ needs.resolve.outputs.channel || 'dev' }}/staging/opendaq",
            "artifacts": ["opendaq-staging-*/core"],
            "idx-identity": ["org.opencontainers.image.revision"],
            "pkg-identity": ["org.opencontainers.image.revision", "com.opendaq.package.triplet"]
          },
          {
            "path": "ghcr.io/${{ github.repository_owner }}/${{ needs.resolve.outputs.channel || 'dev' }}/installer/opendaq",
            "artifacts": ["opendaq-package-*/core"],
            "idx-identity": ["org.opencontainers.image.revision"],
            "pkg-identity": ["org.opencontainers.image.revision", "com.opendaq.package.triplet"]
          }
        ]
